name: Health Check Monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cek Endpoint Health
        id: healthcheck
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://booking-lapang.vercel.app/health-salah)
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Kirim Notifikasi jika Gagal
        if: steps.healthcheck.outputs.status != '200'
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"content\": \"Peringatan: /health mengembalikan status ${{ steps.healthcheck.outputs.status }} (bukan 200)!\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}